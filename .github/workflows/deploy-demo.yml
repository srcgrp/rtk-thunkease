name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allows the Pages deployment to read the repo and mint an id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are not cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo imports the library through its published entry points,
      # so dist has to exist before Vite resolves it.
      - name: Build rtk-thunkease
        run: pnpm build

      - name: Build demo
        run: pnpm --filter rtk-thunkease-demo build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
